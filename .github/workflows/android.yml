name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive

      - name: Apply SpeechRecognizer reuse patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/android-speech-permissions'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/ee/ioc/phon/android/speak/view/SpeechInputView.java')
          s = path.read_text()
          s = s.replace(
              '    private SpeechInputViewListener mListener;\n    private SpeechRecognizer mRecognizer;\n',
              '    private SpeechInputViewListener mListener;\n    private SpeechRecognizer mRecognizer;\n    private ComponentName mRecognizerService;\n',
              1,
          )
          s = s.replace(
              '                    if (finalHide) {\n                        cancelOrDestroy();\n                    }',
              '                    if (finalHide) {\n                        cancelRecognition();\n                    }',
              1,
          )
          old = '''        mComboSelectorView.init(context, prefs, keys, callerInfo, mAppId, key, (language, service) -> {
            if (mState == MicButton.State.RECORDING) {
                stopListening();
            }
            mListener.onComboChange(language, service);
            if (mRvClipboard != null) {
                updateClipboard(getContext(), language, service, mApp);
            }
        });

        updateServiceLanguage(mComboSelectorView.getSpeechRecognizer());
'''
          new = '''        mComboSelectorView.init(context, prefs, keys, callerInfo, mAppId, key, (language, service) -> {
            if (mState != MicButton.State.INIT && mState != MicButton.State.ERROR) {
                cancelRecognition();
                setGuiInitState(0);
            }
            updateRecognitionService(service);
            mListener.onComboChange(language, service);
            if (mRvClipboard != null) {
                updateClipboard(getContext(), language, service, mApp);
            }
        });
'''
          if old not in s:
              raise SystemExit('SpeechInputView combo block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              'startListening(mComboSelectorView.getSpeechRecognizer(), mComboSelectorView.getIntent());',
              'startListening(mComboSelectorView.getIntent());',
          )
          s = s.replace(
              '''            case LISTENING:
            case TRANSCRIBING:
                cancelOrDestroy();
                setGuiInitState(0);
''',
              '''            case LISTENING:
            case TRANSCRIBING:
                cancelRecognition();
                setGuiInitState(0);
''',
              1,
          )
          s = s.replace(
              '''    public void cancel() {
        cancelOrDestroy();
        setGuiInitState(0);
    }
''',
              '''    /** Cancel the current utterance but keep the SpeechRecognizer/service binding warm. */
    public void cancel() {
        cancelRecognition();
        setGuiInitState(0);
    }

    /** Release the SpeechRecognizer and its RecognitionService binding. */
    public void destroy() {
        destroyRecognizer();
        setGuiInitState(0);
    }
''',
              1,
          )
          old = '''    private void updateServiceLanguage(SpeechRecognizer sr) {
        cancelOrDestroy();
        mRecognizer = sr;
        mRecognizer.setRecognitionListener(new SpeechInputRecognitionListener());
    }

    private void startListening(SpeechRecognizer sr, Intent intent) {
        setGuiState(MicButton.State.WAITING);
        updateServiceLanguage(sr);
        try {
            mRecognizer.startListening(intent);
'''
          new = '''    /**
     * Keep one SpeechRecognizer bound while the selected RecognitionService stays the same.
     * A language change can reuse the same binding because the language is carried by the Intent.
     */
    private void updateRecognitionService(ComponentName service) {
        boolean sameService = mRecognizerService == null ? service == null : mRecognizerService.equals(service);
        if (mRecognizer != null && sameService) {
            return;
        }

        destroyRecognizer();
        mRecognizer = mComboSelectorView.getSpeechRecognizer();
        mRecognizerService = service;
        mRecognizer.setRecognitionListener(new SpeechInputRecognitionListener());
    }

    private void startListening(Intent intent) {
        setGuiState(MicButton.State.WAITING);
        if (mRecognizer == null) {
            updateRecognitionService(mComboSelectorView.getService());
        }
        try {
            mRecognizer.startListening(intent);
'''
          if old not in s:
              raise SystemExit('SpeechInputView recognizer setup block not found')
          s = s.replace(old, new, 1)
          old = '''    /**
     * TODO: not sure if it is better to call cancel or destroy
     * Note that SpeechRecognizer#destroy calls cancel first.
     */
    private void cancelOrDestroy() {
        mBtnType = "Y";
        if (mRecognizer != null) {
            mRecognizer.destroy();
            mRecognizer = null;
        }
    }
'''
          new = '''    private void cancelRecognition() {
        mBtnType = "Y";
        if (mRecognizer != null) {
            mRecognizer.cancel();
        }
    }

    private void destroyRecognizer() {
        mBtnType = "Y";
        if (mRecognizer != null) {
            mRecognizer.destroy();
            mRecognizer = null;
        }
        mRecognizerService = null;
    }
'''
          if old not in s:
              raise SystemExit('SpeechInputView cancel/destroy block not found')
          s = s.replace(old, new, 1)
          if 'cancelOrDestroy()' in s or 'updateServiceLanguage(' in s:
              raise SystemExit('Old recognizer lifecycle calls remain')
          path.write_text(s)

          path = Path('app/src/main/java/ee/ioc/phon/android/speak/view/ComboSelectorView.kt')
          s = path.read_text()
          old = '''    val speechRecognizer: SpeechRecognizer
        get() = mSlc.speechRecognizer
    val intent: Intent
        get() = mSlc.intent
'''
          new = '''    val speechRecognizer: SpeechRecognizer
        get() = mSlc.speechRecognizer
    val service: ComponentName
        get() = mSlc.service
    val intent: Intent
        get() = mSlc.intent
'''
          if old not in s:
              raise SystemExit('ComboSelectorView accessor block not found')
          path.write_text(s.replace(old, new, 1))

          path = Path('app/src/main/java/ee/ioc/phon/android/speak/service/SpeechInputMethodService.java')
          s = path.read_text()
          marker = '''    /**
     * This is called at configuration change. We just kill the running session.
'''
          insert = '''    @Override
    public void onDestroy() {
        if (mInputView != null) {
            mInputView.destroy();
        }
        super.onDestroy();
    }

'''
          if marker not in s:
              raise SystemExit('SpeechInputMethodService insertion marker not found')
          s = s.replace(marker, insert + marker, 1)
          old = '''    public View onCreateInputView() {
        Log.i("onCreateInputView");
        //ViewGroup view = (ViewGroup) findViewById(android.R.id.content);
'''
          new = '''    public View onCreateInputView() {
        Log.i("onCreateInputView");
        // A recreated input view must not leave the old SpeechRecognizer binding behind.
        if (mInputView != null) {
            mInputView.destroy();
        }
        //ViewGroup view = (ViewGroup) findViewById(android.R.id.content);
'''
          if old not in s:
              raise SystemExit('SpeechInputMethodService onCreateInputView block not found')
          s = s.replace(old, new, 1)
          old = '''    private void closeSession() {
        if (mInputView != null) {
            mInputView.cancel();
        }
'''
          new = '''    private void closeSession() {
        if (mInputView != null) {
            // Cancel only the active utterance. SpeechInputView deliberately keeps its
            // SpeechRecognizer bound so an external on-device model can stay hot.
            mInputView.cancel();
        }
'''
          if old not in s:
              raise SystemExit('SpeechInputMethodService closeSession block not found')
          path.write_text(s.replace(old, new, 1))

          path = Path('app/src/main/java/ee/ioc/phon/android/speak/activity/SpeechActionActivity.java')
          s = path.read_text()
          old = '''        if (!isChangingConfigurations()) {
            mView.cancel();
        }
'''
          new = '''        if (!isChangingConfigurations()) {
            // Unlike the long-lived IME, this activity should release its service binding
            // when it leaves the foreground.
            mView.destroy();
        }
'''
          if old not in s:
              raise SystemExit('SpeechActionActivity onPause block not found')
          path.write_text(s.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ee/ioc/phon/android/speak/view/SpeechInputView.java \
                  app/src/main/java/ee/ioc/phon/android/speak/view/ComboSelectorView.kt \
                  app/src/main/java/ee/ioc/phon/android/speak/service/SpeechInputMethodService.java \
                  app/src/main/java/ee/ioc/phon/android/speak/activity/SpeechActionActivity.java
          git commit -m "Reuse SpeechRecognizer across IME utterances"
          git push origin HEAD:fix/android-speech-permissions

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Prepare debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk K6nele-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: K6nele-debug-apk
          path: K6nele-debug.apk
          if-no-files-found: error
